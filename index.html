<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>LernCoach · Klasse 5</title><style>body{font-family:system-ui;background:#f1f5f9;color:#172033;margin:0}header{background:#2563eb;color:white;padding:24px}main{max-width:820px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #0001}button,select,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #cbd5e1}button{background:#2563eb;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{background:#e2e8f0;color:#172033}nav button.active{background:#1d4ed8;color:white}.muted{color:#64748b}.good{color:#15803d}.bad{color:#b45309}input{width:130px} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style><link rel="manifest" href="./manifest.webmanifest"></head><body><header><h1>🎓 LernCoach</h1><p>Dein Lernbegleiter · Gymnasium · Klasse 5</p></header><main><nav><button onclick="tab('home')" id="bhome">Übersicht</button><button onclick="tab('learn')" id="blearn">Lernen</button><button onclick="tab('parents')" id="bparents">Elternübersicht</button></nav><div id="view"></div></main><script>
const units=[{q:'Wie viele Zentimeter sind 3 Meter?',a:300,u:'cm',tip:'Ein Meter sind 100 Zentimeter.',why:'3 × 100 = 300 cm.'},{q:'Wie viele Meter sind 2,5 Kilometer?',a:2500,u:'m',tip:'Ein Kilometer sind 1.000 Meter.',why:'2,5 × 1.000 = 2.500 m.'},{q:'Wie viele Millimeter sind 7 Zentimeter?',a:70,u:'mm',tip:'Ein Zentimeter sind 10 Millimeter.',why:'7 × 10 = 70 mm.'},{q:'Wie viele Meter sind 450 Zentimeter?',a:4.5,u:'m',tip:'Teile durch 100.',why:'450 : 100 = 4,5 m.'}];
const scale=[{q:'Maßstab 1 : 10.000, Kartenstrecke 3 cm. Wie viele Meter sind es wirklich?',a:300,u:'m',tip:'3 × 10.000 cm, dann durch 100 teilen.',why:'30.000 cm = 300 m.'},{q:'Maßstab 1 : 20.000, Kartenstrecke 5 cm. Wie viele Meter sind es wirklich?',a:1000,u:'m',tip:'5 × 20.000 cm.',why:'100.000 cm = 1.000 m.'},{q:'Maßstab 1 : 5.000, Wirklichkeit 200 m. Wie viele Zentimeter auf der Karte?',a:4,u:'cm',tip:'200 m = 20.000 cm, dann durch 5.000 teilen.',why:'20.000 : 5.000 = 4 cm.'},{q:'Eine Strecke von 900 m misst auf der Karte 3 cm. Wie groß ist x im Maßstab 1 : x?',a:30000,u:'',tip:'900 m = 90.000 cm, dann durch 3 teilen.',why:'90.000 : 3 = 30.000.'}];
const subjects=['Mathematik','Deutsch (geplant)','Englisch (geplant)','Weitere Fächer (geplant)'];let state=JSON.parse(localStorage.getItem('lerncoach-stats')||'{"done":0,"right":0,"history":[]}');let mode='scale',idx=0,tries=0,answered=false,session=0;
function save(){localStorage.setItem('lerncoach-stats',JSON.stringify(state))}
function tab(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.id==='b'+t));const v=document.getElementById('view');if(t==='home'){v.innerHTML='<section class="card"><h2>Willkommen beim LernCoach 👋</h2><p>Heute etwas Mathe üben? Du kannst dein Thema selbst wählen.</p><button onclick="tab(\'learn\')">Jetzt lernen →</button></section><section class="card"><h3>Dein Lernstand</h3><p>'+state.done+' Aufgaben bearbeitet · '+state.right+' richtig · '+(state.done?Math.round(100*state.right/state.done):0)+' % Trefferquote</p></section><section class="card"><h3>Schulfächer</h3>'+subjects.map(s=>'<p>📚 '+s+'</p>').join('')+'</section>'}else if(t==='parents'){v.innerHTML='<section class="card"><h2>Elternübersicht</h2><p>Bearbeitete Aufgaben: <b>'+state.done+'</b></p><p>Richtig gelöst: <b>'+state.right+'</b></p><p>Trefferquote: <b>'+(state.done?Math.round(100*state.right/state.done):0)+' %</b></p><h3>Letzte Antworten</h3>'+state.history.slice(-10).reverse().map(h=>'<p>'+h.topic+': '+(h.ok?'✓ richtig':'✗ falsch')+'</p>').join('')+'<button onclick="exportData()">Fortschritt exportieren</button></section><p class="muted">Daten werden nur in diesem Browser gespeichert. Keine geräteübergreifende Synchronisierung und kein geschützter Elternzugang.</p>'}else{v.innerHTML='<section class="card"><h2>Mathematik üben</h2><label for="topic">Thema: </label><select id="topic" onchange="changeTopic(this.value)"><option value="scale">Maßstab 1 : x</option><option value="units">Maßeinheiten</option><option value="mixed">Gemischte Aufgaben</option></select><div id="task"></div></section>';document.getElementById('topic').value=mode;task()}}
function qs(){return mode==='units'?units:mode==='scale'?scale:[units[0],scale[0],units[3],scale[2],scale[3]]}
function changeTopic(m){mode=m;idx=0;tries=0;answered=false;session=0;task()}
function task(){let q=qs()[idx];document.getElementById('task').innerHTML='<p class="muted">Aufgabe '+(idx+1)+' von '+qs().length+'</p><h3>'+q.q+'</h3><div class="row"><input id="ans" inputmode="decimal" placeholder="Antwort" '+(answered?'disabled':'')+'><b>'+q.u+'</b><button id="check" onclick="check()" '+(answered?'disabled':'')+'>Prüfen</button></div><div id="feedback"></div><div id="next"></div>'}
function check(){let q=qs()[idx],raw=document.getElementById('ans').value.trim().replace(',','.');if(!raw)return;let ok=Math.abs(Number(raw)-q.a)<0.000001;tries++;if(ok){answered=true;session++;state.done++;state.right++;state.history.push({topic:mode,ok:true});save();document.getElementById('feedback').innerHTML='<p class="good"><b>Richtig! 🎉</b> '+q.why+'</p>';document.getElementById('check').disabled=true;document.getElementById('ans').disabled=true;document.getElementById('next').innerHTML='<button onclick="next()">Weiter →</button>'}else{document.getElementById('feedback').innerHTML='<p class="bad"><b>Versuch es noch einmal.</b> '+q.tip+(tries>=2?' Rechenweg: '+q.why:'')+'</p>';if(tries>=3){state.done++;state.history.push({topic:mode,ok:false});save();answered=true;document.getElementById('check').disabled=true;document.getElementById('next').innerHTML='<button onclick="next()">Nächste Aufgabe →</button>'}}}
function next(){if(idx+1>=qs().length){document.getElementById('task').innerHTML='<h3>Training geschafft! 🏆</h3><p>'+session+' von '+qs().length+' Aufgaben richtig gelöst.</p><button onclick="changeTopic(mode)">Neue Runde</button>'}else{idx++;tries=0;answered=false;task()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='lerncoach-fortschritt.json';a.click();URL.revokeObjectURL(a.href)}
tab('home');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
